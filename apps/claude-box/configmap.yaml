apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-box-init
  namespace: claude-box
data:
  # Wird von Webtop beim Start als root ausgeführt.
  # nodejs kommt im Image aus NodeSource und enthält npm bereits.
  10-install-tools.sh: |
    #!/bin/bash
    set -e
    if ! command -v chromium >/dev/null || ! command -v tmux >/dev/null; then
      apt-get update
      apt-get install -y --no-install-recommends \
        chromium nodejs tmux git curl ca-certificates ripgrep
      rm -rf /var/lib/apt/lists/*
    fi
  # Dauerdienst (s6): Claude im Remote-Control-Server-Modus, erreichbar über
  # claude.ai/code und die Claude-App. Wartet, bis Claude installiert und angemeldet ist.
  # --permission-mode auto: ein Klassifikator gibt Werkzeugaufrufe frei und fragt nur bei
  # riskanten Aktionen nach (wichtig für Agent Teams, deren Rückfragen sonst alle beim
  # Lead landen). stdout (Statusanzeige) wird verworfen, Fehler (stderr) bleiben im Pod-Log.
  claude-remote-control: |
    #!/bin/bash
    CLAUDE=/config/.local/bin/claude
    until [ -x "$CLAUDE" ] && [ -s /config/.claude/.credentials.json ]; do
      sleep 30
    done
    mkdir -p /config/projects
    cd /config/projects
    exec s6-setuidgid abc env HOME=/config DISPLAY=:1 \
      PATH=/config/.local/bin:/usr/local/bin:/usr/bin:/bin \
      "$CLAUDE" remote-control --name claude-box --permission-mode auto >/dev/null
