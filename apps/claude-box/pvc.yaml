apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-box-config
  namespace: claude-box
  labels:
    app: claude-box
  annotations:
    # local-path löscht die Daten mit dem PVC; Flux soll ihn nie automatisch entfernen.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
